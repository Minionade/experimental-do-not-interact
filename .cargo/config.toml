[env]
# SDL2's bundled build declares an older CMake policy baseline.
# CMake 4 removed compatibility below 3.5; leave caller overrides intact.
CMAKE_POLICY_VERSION_MINIMUM = { value = "3.5", force = false }
# SDL2 0.37's bundled C sources predate C23 (bool/true/false keywords).
# New Linux compilers default to C23; retain the C dialect these sources require.
CFLAGS_x86_64_unknown_linux_gnu = { value = "-std=gnu11", force = false }
